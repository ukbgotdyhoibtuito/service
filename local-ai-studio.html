async function getBuf(url,label,pc){ // 큰 파일을 캐시에 저장하며 내려받기
 const c=await caches.open('sd-turbo');let r=await c.match(url);
 if(!r){
  r=await fetch(url);if(!r.ok)throw new Error(label+' 다운로드 실패 ('+r.status+')');
  const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;pc({status:'progress',file:label,loaded:got,total:total||got})}
  const blob=new Blob(ch);ch.length=0;
  try{await c.put(url,new Response(blob))}catch(e){} // 저장 공간 부족하면 캐시만 건너뜀
  pc({status:'done',file:label});return await blob.arrayBuffer();
 }
 const b=await r.arrayBuffer();pc({status:'progress',file:label,loaded:b.byteLength,total:b.byteLength});pc({status:'done',file:label});return b;
}
async function loadSD(repo,pc){
 ort=await import(ORT+'ort.webgpu.min.mjs');
 ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths=ORT;
 try{ort.env.webgpu.powerPreference='high-performance'}catch(e){} // 노트북은 내장 GPU 대신 외장 GPU 사용
 const tk=await T.AutoTokenizer.from_pretrained('Xenova/clip-vit-base-patch16',{progress_callback:pc});
 const base='https://huggingface.co/'+repo+'/resolve/main/';
 const mk=dims=>({executionProviders:['webgpu'],enableMemPattern:false,enableCpuMemArena:false,graphOptimizationLevel:'all',freeDimensionOverrides:dims,
  extra:{session:{disable_prepacking:'1',use_device_allocator_for_initializers:'1'}}});
 // 세 파일을 동시에 내려받고(첫 로딩 단축), 세션은 받는 순서대로 하나씩 만든다
 const P=[['text_encoder/model.onnx','text_encoder.onnx'],['unet/model.onnx','unet.onnx'],['vae_decoder/model.onnx','vae_decoder.onnx']].map(([p,l])=>getBuf(base+p,l,pc));
 P.forEach(p=>p.catch(()=>{}));
 const mkS=async(i,dims)=>{const b=await P[i];P[i]=null;return await ort.InferenceSession.create(new Uint8Array(b),mk(dims))};
 const te=await mkS(0,{batch_size:1});
 const unet=await mkS(1,{batch_size:1,num_channels:4,height:64,width:64,sequence_length:77});
 const vae=await mkS(2,{batch_size:1,num_channels_latent:4,height_latent:64,width_latent:64});
 sd={tk,te,unet,vae};
}
let duty=0; // SD: 단계 사이 쉬는 비율
let mk=0;const rest=async()=>{if(duty)await new Promise(r=>setTimeout(r,(performance.now()-mk)*duty));mk=performance.now()};
// 토큰 사이 쉬는 시간: 토큰 하나 만드는 시간의 35%를 넘지 않게 제한 (빠른 모델이 불필요하게 느려지지 않도록)
let lt=0;const tokGap=g=>{const now=performance.now();nap(Math.min(g,lt?(now-lt)*.35:g));lt=performance.now()};
// Janus: 토큰 하나 만들 때마다 잠깐 쉬는 로짓 프로세서 (과부하 방지)
let GapLP=null;
async function genSD(prompt){mk=performance.now();
 const r=sd.tk(prompt,{truncation:true,max_length:77,return_tensor:false});
 let ids=r.input_ids;if(Array.isArray(ids[0]))ids=ids[0];ids=Array.from(ids,Number);
 if(ids.length>77){ids=ids.slice(0,77);ids[76]=49407}
 while(ids.length<77)ids.push(0);
 const tin=sd.te.inputNames[0];let eo;
 try{eo=await sd.te.run({[tin]:new ort.Tensor('int32',Int32Array.from(ids),[1,77])})}
 catch(e){eo=await sd.te.run({[tin]:new ort.Tensor('int64',BigInt64Array.from(ids,BigInt),[1,77])})}
 await rest();
 const hs=eo.last_hidden_state||Object.values(eo)[0];
 const fp16=hs.type==='float16';
 const T_=(a,dims)=>fp16?new ort.Tensor('float16',half(a),dims):new ort.Tensor('float32',a,dims);
 // 스케줄러: Euler Ancestral, 1스텝(timestep 999)
 let ac=1,sig=0;
 for(let i=0;i<1000;i++){const b=Math.pow(Math.sqrt(0.00085)+(Math.sqrt(0.012)-Math.sqrt(0.00085))*i/999,2);ac*=1-b;if(i===999)sig=Math.sqrt((1-ac)/ac)}
 const n=4*64*64,lat=new Float32Array(n),sc=1/Math.sqrt(sig*sig+1),inp=new Float32Array(n);
 for(let i=0;i<n;i++){lat[i]=randn()*sig;inp[i]=lat[i]*sc}
 const nm=sd.unet.inputNames,find=re=>nm.find(x=>re.test(x));
 const fs=find(/sample/i)||nm[0],ft=find(/time/i)||nm[1],fh=find(/hidden|encoder/i)||nm[2];
 let uo;
 try{uo=await sd.unet.run({[fs]:T_(inp,[1,4,64,64]),[ft]:new ort.Tensor('int64',BigInt64Array.from([999n]),[1]),[fh]:hs})}
 catch(e){uo=await sd.unet.run({[fs]:T_(inp,[1,4,64,64]),[ft]:T_(new Float32Array([999]),[1]),[fh]:hs})}
 const eps=f32(await (uo.out_sample||Object.values(uo)[0]).getData());await rest();
 const pr=new Float32Array(n);
 for(let i=0;i<n;i++)pr[i]=(lat[i]-sig*eps[i])/0.18215;
 // VAE 입력 정밀도가 UNet과 다를 수 있어 실패하면 반대로 재시도
 const vrun=f=>sd.vae.run({[sd.vae.inputNames[0]]:f?new ort.Tensor('float16',half(pr),[1,4,64,64]):new ort.Tensor('float32',pr,[1,4,64,64])});
 let vo;try{vo=await vrun(fp16)}catch(e){vo=await vrun(!fp16)}
 const px=f32(await (vo.sample||Object.values(vo)[0]).getData());
 const HW=px.length/3,W=Math.round(Math.sqrt(HW));
 const oc=new OffscreenCanvas(W,W),cx=oc.getContext('2d'),id=cx.createImageData(W,W);
 for(let i=0;i<HW;i++){for(let c=0;c<3;c++){const v=Math.min(1,Math.max(0,px[c*HW+i]/2+.5));id.data[i*4+c]=Math.round(v*255)}id.data[i*4+3]=255}
 cx.putImageData(id,0,0);
 postMessage({type:'img',blob:await oc.convertToBlob({type:'image/png'})});
}

onmessage=async({data:d})=>{
try{
if(d.type==='load'){
T=await import(d.lib===4?LIB4:LIB);eng=d.eng;LR=d.repo;
try{T.env.backends.onnx.webgpu.powerPreference='high-performance'}catch(e){} // 외장 GPU 우선
if(d.safe){try{T.env.backends.onnx.wasm.numThreads=d.thr}catch(e){}}
const pc=p=>postMessage({type:'prog',p});
if(eng==='chat'){
tok=await T.AutoTokenizer.from_pretrained(d.repo,{progress_callback:pc});
m=await (d.cls?T[d.cls]:T.AutoModelForCausalLM).from_pretrained(d.repo,{dtype:(d.dtype==='q4f16'&&!d.f16?'q4':d.dtype),device:'webgpu',progress_callback:pc});
await m.generate({...tok('hi'),max_new_tokens:1}); // 워밍업(GPU 초기화)
}else if(eng==='janus'){
GapLP=class extends T.LogitsProcessor{constructor(ms){super();this.ms=ms}_call(ids,logits){tokGap(this.ms);return logits}};
proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc});
m=await T.MultiModalityCausalLM.from_pretrained(d.repo,{progress_callback:pc,
dtype:{prepare_inputs_embeds:'q4',language_model:'q4f16',lm_head:'fp16',gen_head:'fp16',gen_img_embeds:'fp16',image_decode:'fp32'},
device:{prepare_inputs_embeds:'wasm',language_model:'webgpu',lm_head:'webgpu',gen_head:'webgpu',gen_img_embeds:'webgpu',image_decode:'webgpu'}});
}else if(eng==='sd'){
await loadSD(d.repo,pc);
}else if(eng==='bg'){ // RMBG-1.4 (WebGPU 우선, 실패 시 CPU)
if(d.dev==='webgpu'){try{await loadBG('webgpu',pc)}catch(e){await loadBG('wasm',pc)}}else await loadBG('wasm',pc);
}else if(eng==='modnet'){
m=await T.AutoModel.from_pretrained(d.repo,{progress_callback:pc});
proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc});
}else if(eng==='sr'){
pipe=await T.pipeline('image-to-image',d.repo,{progress_callback:pc});
}else if(eng==='asr'){ // Whisper 음성 인식
const gpu=d.dev==='webgpu';
try{pipe=await T.pipeline('automatic-speech-recognition',d.repo,{device:gpu?'webgpu':'wasm',dtype:gpu?{encoder_model:/large/.test(d.repo)?'fp16':'fp32',decoder_model_merged:'q4'}:'q8',progress_callback:pc})}
catch(e){if(!gpu)throw e;pipe=await T.pipeline('automatic-speech-recognition',d.repo,{device:'wasm',dtype:'q8',progress_callback:pc})}
}
postMessage({type:'ready'});
}else if(d.type==='chat'){
stopper=new T.InterruptableStoppingCriteria();
const inp=tok.apply_chat_template(d.messages,{add_generation_prompt:true,return_dict:true,...(d.noThink?{enable_thinking:false}:{})});
const pl=inp.input_ids.dims.at(-1);let nn=0;postMessage({type:'n',n:pl});
const st=new T.TextStreamer(tok,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>postMessage({type:'tok',t}),token_callback_function:()=>{postMessage({type:'n',n:pl+(++nn)});if(d.gap)tokGap(d.gap)}});lt=0;
await m.generate({...inp,max_new_tokens:d.max,do_sample:true,temperature:.7,top_p:.9,streamer:st,stopping_criteria:stopper});
postMessage({type:'done',cut:nn>=d.max});
}else if(d.type==='count'){
const ids=tok.apply_chat_template([...d.messages,...(d.draft?[{role:'user',content:d.draft}]:[])],{add_generation_prompt:!!d.draft,tokenize:true,return_tensor:false,...(d.noThink?{enable_thinking:false}:{})});
postMessage({type:'cnt',n:ids.length});
}else if(d.type==='stop'){stopper&&stopper.interrupt()}
else if(d.type==='image'){
duty=d.duty||0;lt=0;if(eng==='sd'){await genSD(d.prompt)}
else{
const inp=await proc([{role:'<|User|>',content:d.prompt}],{chat_template:'text_to_image'});
const n=proc.num_image_tokens;
const out=await m.generate_images({...inp,min_new_tokens:n,max_new_tokens:n,do_sample:true,logits_processor:d.gap?[new GapLP(d.gap)]:undefined});
postMessage({type:'img',blob:await out[0].toBlob()});
}
}else if(d.type==='asr'){ // 30초 단위로 나눠 인식하며 구간마다 결과 전달
const a=new Float32Array(d.audio),WIN=480000,n=Math.ceil(a.length/WIN);
for(let i=0;i<n;i++){
const ch=a.subarray(i*WIN,Math.min((i+1)*WIN,a.length));
if(ch.length<8000){postMessage({type:'aseg',i,n,off:i*30,chunks:[]});continue}
const o={return_timestamps:true,task:'transcribe'};if(d.lang)o.language=d.lang;
const t1=performance.now(),r=await pipe(ch,o);
postMessage({type:'aseg',i,n,off:i*30,chunks:(r.chunks||[]).map(c=>({s:c.timestamp[0],e:c.timestamp[1],t:c.text}))});
if(d.duty)await new Promise(q=>setTimeout(q,(performance.now()-t1)*d.duty));
}
postMessage({type:'adone'});
}else if(d.type==='tool'){
const im=new T.RawImage(new Uint8ClampedArray(d.px),d.w,d.h,4).rgb();
if(eng==='sr'){
const o=await pipe(im),out=Array.isArray(o)?o[0]:o;
postMessage({type:'tres',data:out.data,w:out.width,h:out.height,c:out.channels});
}else{ // 배경 제거: 마스크만 돌려주고 합성은 화면 쪽에서
let mk;
if(eng==='bg'){try{mk=await runBG(im)}catch(e){if(tdev!=='webgpu')throw e;await loadBG('wasm',()=>{});mk=await runBG(im)}} // GPU 실행이 실패하면 CPU로 자동 전환
else{const {pixel_values}=await proc(im);const {output}=await m({input:pixel_values});mk=output[0].mul(255).to('uint8')}
postMessage({type:'tres',mask:mk.data,w:mk.dims.at(-1),h:mk.dims.at(-2)});
}
}
}catch(e){postMessage({type:'err',msg:String(e&&e.message||e)})}
};

const compose=async d=>{let c;
if(bg){const W=src.naturalWidth,H=src.naturalHeight,mc=document.createElement('canvas');mc.width=d.w;mc.height=d.h;
const mi=new ImageData(d.w,d.h);for(let i=0;i<d.mask.length;i++)mi.data[i*4+3]=d.mask[i];
mc.getContext('2d').putImageData(mi,0,0);
c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
x.drawImage(src,0,0,W,H);x.globalCompositeOperation='destination-in';x.imageSmoothingQuality='high';x.drawImage(mc,0,0,W,H)}
else{c=document.createElement('canvas');c.width=d.w;c.height=d.h;
const id=new ImageData(d.w,d.h),n=d.w*d.h,ch=d.c;
for(let i=0;i<n;i++){for(let k=0;k<3;k++)id.data[i*4+k]=d.data[i*ch+(ch>=3?k:0)];id.data[i*4+3]=255}
c.getContext('2d').putImageData(id,0,0)}
const b=await new Promise(r=>c.toBlob(r,'image/png')),u=URL.createObjectURL(b);
st.tgal.unshift({u,bg});show(u,bg);gal()};
$('#go').onclick=()=>{if(!src||st.busy)return;st.busy=true;$('#go').disabled=true;$('#gb').style.display='block';
const sc=Math.min(1,(m.maxIn||1024)/Math.max(src.naturalWidth,src.naturalHeight)),w=Math.max(1,Math.round(src.naturalWidth*sc)),h=Math.max(1,Math.round(src.naturalHeight*sc));
const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(src,0,0,w,h);
const px=cx.getImageData(0,0,w,h).data.buffer;
const t0=Date.now(),iv=setInterval(()=>$('#tm').textContent='처리 중… '+Math.round((Date.now()-t0)/1000)+'초',1000);
const done=()=>{clearInterval(iv);st.busy=false;$('#go').disabled=false;$('#gb').style.display='none'};
st.worker.onmessage=async({data:d})=>{
if(d.type==='tres'){try{await compose(d);$('#tm').textContent='완료'}catch(e){$('#tm').textContent='오류: '+e.message}done()}
else if(d.type==='err'){$('#tm').textContent='오류: '+d.msg;done()}};
st.worker.postMessage({type:'tool',px,w,h},[px])};
}
home();
</script></body></html>
