<!-- 모델 실행 Worker (Blob으로 생성). 라이브러리를 프로젝트에 포함하려면 LIB 경로를 로컬 파일로 바꾸면 됨 -->
<script type="text/plain" id="wk">
const LIB='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1';
const LIB4='https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2'; // 대화 모델용 (Gemma 3 등 v3에서 로딩이 중단되는 모델 대응)
const ORT='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
let T,m,tok,proc,stopper,eng,ort,sd,pipe,LR,tdev='wasm';
// 동기 대기: 교차 출처 격리 환경이면 Atomics.wait로 CPU를 쉬게 하고, 아니면 짧게 대기(스핀)
let SL=null;try{if(self.crossOriginIsolated&&typeof SharedArrayBuffer!=='undefined')SL=new Int32Array(new SharedArrayBuffer(4))}catch(e){}
const nap=ms=>{if(!(ms>0))return;if(SL){Atomics.wait(SL,0,0,ms);return}const t=performance.now()+ms;while(performance.now()<t){}};
// RMBG 배경 제거: WebGPU가 되면 GPU로, 실패하면 CPU(wasm)로
async function loadBG(dev,pc){tdev=dev;
m=await T.AutoModel.from_pretrained(LR,{config:{model_type:'custom'},progress_callback:pc,...(dev==='webgpu'?{device:'webgpu',dtype:'fp32'}:{})});
proc=await T.AutoProcessor.from_pretrained(LR,{progress_callback:pc,config:{do_normalize:true,do_pad:false,do_rescale:true,do_resize:true,image_mean:[0.5,0.5,0.5],feature_extractor_type:'ImageFeatureExtractor',image_std:[1,1,1],resample:2,rescale_factor:0.00392156862745098,size:{width:1024,height:1024}}})}
const runBG=async im=>{const {pixel_values}=await proc(im);const {output}=await m({input:pixel_values});return output[0].mul(255).to('uint8')};

// ----- SD-Turbo (onnxruntime-web 직접 실행) -----
const half=f=>{const o=new Uint16Array(f.length),b=new Float32Array(1),u=new Uint32Array(b.buffer);
 for(let i=0;i<f.length;i++){b[0]=f[i];const x=u[0],s=(x>>>16)&0x8000,e=((x>>>23)&0xff)-112,mm=(x>>>13)&0x3ff;
  o[i]=e<=0?s:e>=31?(s|0x7c00):(s|(e<<10)|mm)}return o};
const unhalf=h=>{const o=new Float32Array(h.length);
 for(let i=0;i<h.length;i++){const x=h[i],s=x&0x8000?-1:1,e=(x>>10)&31,mm=x&1023;
  o[i]=e===0?s*mm*5.960464477539063e-8:e===31?(mm?NaN:s*Infinity):s*Math.pow(2,e-15)*(1+mm/1024)}return o};
const f32=raw=>raw instanceof Float32Array?raw:raw instanceof Uint16Array?unhalf(raw):Float32Array.from(raw);
const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

async function getBuf(url,label,pc){ // 큰 파일을 캐시에 저장하며 내려받기
 const c=await caches.open('sd-turbo');let r=await c.match(url);
 if(!r){
  r=await fetch(url);if(!r.ok)throw new Error(label+' 다운로드 실패 ('+r.status+')');
  const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;pc({status:'progress',file:label,loaded:got,total:total||got})}
  const blob=new Blob(ch);ch.length=0;
  try{await c.put(url,new Response(blob))}catch(e){} // 저장 공간 부족하면 캐시만 건너뜀
  pc({status:'done',file:label});return await blob.arrayBuffer();
 }
 const b=await r.arrayBuffer();pc({status:'progress',file:label,loaded:b.byteLength,total:b.byteLength});pc({status:'done',file:label});return b;
}
async function loadSD(repo,pc){
 ort=await import(ORT+'ort.webgpu.min.mjs');
 ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths=ORT;
 try{ort.env.webgpu.powerPreference='high-performance'}catch(e){} // 노트북은 내장 GPU 대신 외장 GPU 사용
 const tk=await T.AutoTokenizer.from_pretrained('Xenova/clip-vit-base-patch16',{progress_callback:pc});
 const base='https://huggingface.co/'+repo+'/resolve/main/';
 const mk=dims=>({executionProviders:['webgpu'],enableMemPattern:false,enableCpuMemArena:false,graphOptimizationLevel:'all',freeDimensionOverrides:dims,
  extra:{session:{disable_prepacking:'1',use_device_allocator_for_initializers:'1'}}});
 // 세 파일을 동시에 내려받고(첫 로딩 단축), 세션은 받는 순서대로 하나씩 만든다
 const P=[['text_encoder/model.onnx','text_encoder.onnx'],['unet/model.onnx','unet.onnx'],['vae_decoder/model.onnx','vae_decoder.onnx']].map(([p,l])=>getBuf(base+p,l,pc));
 P.forEach(p=>p.catch(()=>{}));
 const mkS=async(i,dims)=>{const b=await P[i];P[i]=null;return await ort.InferenceSession.create(new Uint8Array(b),mk(dims))};
 const te=await mkS(0,{batch_size:1});
 const unet=await mkS(1,{batch_size:1,num_channels:4,height:64,width:64,sequence_length:77});
 const vae=await mkS(2,{batch_size:1,num_channels_latent:4,height_latent:64,width_latent:64});
 sd={tk,te,unet,vae};
}
let duty=0; // SD: 단계 사이 쉬는 비율
let mk=0;const rest=async()=>{if(duty)await new Promise(r=>setTimeout(r,(performance.now()-mk)*duty));mk=performance.now()};
// 토큰 사이 쉬는 시간: 토큰 하나 만드는 시간의 35%를 넘지 않게 제한 (빠른 모델이 불필요하게 느려지지 않도록)
let lt=0;const tokGap=g=>{const now=performance.now();nap(Math.min(g,lt?(now-lt)*.35:g));lt=performance.now()};
// Janus: 토큰 하나 만들 때마다 잠깐 쉬는 로짓 프로세서 (과부하 방지)
let GapLP=null;
async function genSD(prompt){mk=performance.now();
 const r=sd.tk(prompt,{truncation:true,max_length:77,return_tensor:false});
 let ids=r.input_ids;if(Array.isArray(ids[0]))ids=ids[0];ids=Array.from(ids,Number);
 if(ids.length>77){ids=ids.slice(0,77);ids[76]=49407}
 while(ids.length<77)ids.push(0);
 const tin=sd.te.inputNames[0];let eo;
 try{eo=await sd.te.run({[tin]:new ort.Tensor('int32',Int32Array.from(ids),[1,77])})}
 catch(e){eo=await sd.te.run({[tin]:new ort.Tensor('int64',BigInt64Array.from(ids,BigInt),[1,77])})}
 await rest();
 const hs=eo.last_hidden_state||Object.values(eo)[0];
 const fp16=hs.type==='float16';
 const T_=(a,dims)=>fp16?new ort.Tensor('float16',half(a),dims):new ort.Tensor('float32',a,dims);
 // 스케줄러: Euler Ancestral, 1스텝(timestep 999)
 let ac=1,sig=0;
 for(let i=0;i<1000;i++){const b=Math.pow(Math.sqrt(0.00085)+(Math.sqrt(0.012)-Math.sqrt(0.00085))*i/999,2);ac*=1-b;if(i===999)sig=Math.sqrt((1-ac)/ac)}
 const n=4*64*64,lat=new Float32Array(n),sc=1/Math.sqrt(sig*sig+1),inp=new Float32Array(n);
 for(let i=0;i<n;i++){lat[i]=randn()*sig;inp[i]=lat[i]*sc}
 const nm=sd.unet.inputNames,find=re=>nm.find(x=>re.test(x));
 const fs=find(/sample/i)||nm[0],ft=find(/time/i)||nm[1],fh=find(/hidden|encoder/i)||nm[2];
 let uo;
 try{uo=await sd.unet.run({[fs]:T_(inp,[1,4,64,64]),[ft]:new ort.Tensor('int64',BigInt64Array.from([999n]),[1]),[fh]:hs})}
 catch(e){uo=await sd.unet.run({[fs]:T_(inp,[1,4,64,64]),[ft]:T_(new Float32Array([999]),[1]),[fh]:hs})}
 const eps=f32(await (uo.out_sample||Object.values(uo)[0]).getData());await rest();
 const pr=new Float32Array(n);
 for(let i=0;i<n;i++)pr[i]=(lat[i]-sig*eps[i])/0.18215;
 // VAE 입력 정밀도가 UNet과 다를 수 있어 실패하면 반대로 재시도
 const vrun=f=>sd.vae.run({[sd.vae.inputNames[0]]:f?new ort.Tensor('float16',half(pr),[1,4,64,64]):new ort.Tensor('float32',pr,[1,4,64,64])});
 let vo;try{vo=await vrun(fp16)}catch(e){vo=await vrun(!fp16)}
 const px=f32(await (vo.sample||Object.values(vo)[0]).getData());
 const HW=px.length/3,W=Math.round(Math.sqrt(HW));
 const oc=new OffscreenCanvas(W,W),cx=oc.getContext('2d'),id=cx.createImageData(W,W);
 for(let i=0;i<HW;i++){for(let c=0;c<3;c++){const v=Math.min(1,Math.max(0,px[c*HW+i]/2+.5));id.data[i*4+c]=Math.round(v*255)}id.data[i*4+3]=255}
 cx.putImageData(id,0,0);
 postMessage({type:'img',blob:await oc.convertToBlob({type:'image/png'})});
}

onmessage=async({data:d})=>{
try{
if(d.type==='load'){
T=await import(d.lib===4?LIB4:LIB);eng=d.eng;LR=d.repo;
try{T.env.backends.onnx.webgpu.powerPreference='high-performance'}catch(e){} // 외장 GPU 우선
if(d.safe){try{T.env.backends.onnx.wasm.numThreads=d.thr}catch(e){}}
const pc=p=>postMessage({type:'prog',p});
if(eng==='chat'){
tok=await T.AutoTokenizer.from_pretrained(d.repo,{progress_callback:pc});
m=await (d.cls?T[d.cls]:T.AutoModelForCausalLM).from_pretrained(d.repo,{dtype:(d.dtype==='q4f16'&&!d.f16?'q4':d.dtype),device:'webgpu',progress_callback:pc});
await m.generate({...tok('hi'),max_new_tokens:1}); // 워밍업(GPU 초기화)
}else if(eng==='janus'){
GapLP=class extends T.LogitsProcessor{constructor(ms){super();this.ms=ms}_call(ids,logits){tokGap(this.ms);return logits}};
proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc});
m=await T.MultiModalityCausalLM.from_pretrained(d.repo,{progress_callback:pc,
dtype:{prepare_inputs_embeds:'q4',language_model:'q4f16',lm_head:'fp16',gen_head:'fp16',gen_img_embeds:'fp16',image_decode:'fp32'},
device:{prepare_inputs_embeds:'wasm',language_model:'webgpu',lm_head:'webgpu',gen_head:'webgpu',gen_img_embeds:'webgpu',image_decode:'webgpu'}});
}else if(eng==='sd'){
await loadSD(d.repo,pc);
}else if(eng==='bg'){ // RMBG-1.4 (WebGPU 우선, 실패 시 CPU)
if(d.dev==='webgpu'){try{await loadBG('webgpu',pc)}catch(e){await loadBG('wasm',pc)}}else await loadBG('wasm',pc);
}else if(eng==='modnet'){
m=await T.AutoModel.from_pretrained(d.repo,{progress_callback:pc});
proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc});
}else if(eng==='sr'){
pipe=await T.pipeline('image-to-image',d.repo,{progress_callback:pc});
}else if(eng==='asr'){ // Whisper 음성 인식
const gpu=d.dev==='webgpu';
try{pipe=await T.pipeline('automatic-speech-recognition',d.repo,{device:gpu?'webgpu':'wasm',dtype:gpu?{encoder_model:/large/.test(d.repo)?'fp16':'fp32',decoder_model_merged:'q4'}:'q8',progress_callback:pc})}
catch(e){if(!gpu)throw e;pipe=await T.pipeline('automatic-speech-recognition',d.repo,{device:'wasm',dtype:'q8',progress_callback:pc})}
}
postMessage({type:'ready'});
}else if(d.type==='chat'){
stopper=new T.InterruptableStoppingCriteria();
const inp=tok.apply_chat_template(d.messages,{add_generation_prompt:true,return_dict:true,...(d.noThink?{enable_thinking:false}:{})});
const pl=inp.input_ids.dims.at(-1);let nn=0;postMessage({type:'n',n:pl});
const st=new T.TextStreamer(tok,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>postMessage({type:'tok',t}),token_callback_function:()=>{postMessage({type:'n',n:pl+(++nn)});if(d.gap)tokGap(d.gap)}});lt=0;
await m.generate({...inp,max_new_tokens:d.max,do_sample:true,temperature:.7,top_p:.9,streamer:st,stopping_criteria:stopper});
postMessage({type:'done',cut:nn>=d.max});
}else if(d.type==='count'){
const ids=tok.apply_chat_template([...d.messages,...(d.draft?[{role:'user',content:d.draft}]:[])],{add_generation_prompt:!!d.draft,tokenize:true,return_tensor:false,...(d.noThink?{enable_thinking:false}:{})});
postMessage({type:'cnt',n:ids.length});
}else if(d.type==='stop'){stopper&&stopper.interrupt()}
else if(d.type==='image'){
duty=d.duty||0;lt=0;if(eng==='sd'){await genSD(d.prompt)}
else{
const inp=await proc([{role:'<|User|>',content:d.prompt}],{chat_template:'text_to_image'});
const n=proc.num_image_tokens;
const out=await m.generate_images({...inp,min_new_tokens:n,max_new_tokens:n,do_sample:true,logits_processor:d.gap?[new GapLP(d.gap)]:undefined});
postMessage({type:'img',blob:await out[0].toBlob()});
}
}else if(d.type==='asr'){ // 30초 단위로 나눠 인식하며 구간마다 결과 전달
const a=new Float32Array(d.audio),WIN=480000,n=Math.ceil(a.length/WIN);
for(let i=0;i<n;i++){
const ch=a.subarray(i*WIN,Math.min((i+1)*WIN,a.length));
if(ch.length<8000){postMessage({type:'aseg',i,n,off:i*30,chunks:[]});continue}
const o={return_timestamps:true,task:'transcribe'};if(d.lang)o.language=d.lang;
const r=await pipe(ch,o);
postMessage({type:'aseg',i,n,off:i*30,chunks:(r.chunks||[]).map(c=>({s:c.timestamp[0],e:c.timestamp[1],t:c.text}))});
}
postMessage({type:'adone'});
}else if(d.type==='tool'){
const im=new T.RawImage(new Uint8ClampedArray(d.px),d.w,d.h,4).rgb();
if(eng==='sr'){
const o=await pipe(im),out=Array.isArray(o)?o[0]:o;
postMessage({type:'tres',data:out.data,w:out.width,h:out.height,c:out.channels});
}else{ // 배경 제거: 마스크만 돌려주고 합성은 화면 쪽에서
let mk;
if(eng==='bg'){try{mk=await runBG(im)}catch(e){if(tdev!=='webgpu')throw e;await loadBG('wasm',()=>{});mk=await runBG(im)}} // GPU 실행이 실패하면 CPU로 자동 전환
else{const {pixel_values}=await proc(im);const {output}=await m({input:pixel_values});mk=output[0].mul(255).to('uint8')}
postMessage({type:'tres',mask:mk.data,w:mk.dims.at(-1),h:mk.dims.at(-2)});
}
}
}catch(e){postMessage({type:'err',msg:String(e&&e.message||e)})}
};
</script>

async function bench(key){

try{const a=await navigator.gpu.requestAdapter({powerPreference:'high-performance'}),d=await a.requestDevice();
const mod=d.createShaderModule({code:`@group(0) @binding(0) var<storage,read_write> o:array<f32>;
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) g:vec3<u32>){
var x=vec4<f32>(f32(g.x)*0.001);for(var i=0u;i<4096u;i++){x=fma(x,vec4<f32>(0.999),vec4<f32>(0.001));}
o[g.x]=x.x+x.y+x.z+x.w;}`});
const WG=4096,buf=d.createBuffer({size:WG*256*4,usage:GPUBufferUsage.STORAGE});
const pl=d.createComputePipeline({layout:'auto',compute:{module:mod,entryPoint:'main'}});
const bg=d.createBindGroup({layout:pl.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:buf}}]});
const run=async n=>{const e=d.createCommandEncoder(),p=e.beginComputePass();p.setPipeline(pl);p.setBindGroup(0,bg);

await run(1);const t0=performance.now();await run(3);const ms=performance.now()-t0;
d.destroy();const gf=WG*256*4096*8*3/ms/1e6;

if(!list.length)return alert('번역에 쓸 수 있는 다운로드된 대화 모델이 없습니다. 대화 모델(예: Qwen3 0.6B)을 먼저 받아 주세요.');
st.busy=true;$('#go').disabled=$('#tr').disabled=true;tryTr(list,0,t)};
$('#sv').onclick=()=>{const a=document.createElement('a');a.href=$('#out').src;a.download='image-'+Date.now()+'.png';a.click()};
$('#go').onclick=()=>{const p=$('#pr').value.trim();if(!p||st.busy)return;st.busy=true;wake(true);$('#go').disabled=true;$('#gb').style.display='block';
const t0=Date.now(),iv=setInterval(()=>$('#tm').textContent='생성 중… '+Math.round((Date.now()-t0)/1000)+'초',1000);
const done=()=>{clearInterval(iv);wake(false);st.busy=false;$('#go').disabled=false;$('#gb').style.display='none'};
st.worker.onmessage=({data:d})=>{
if(d.type==='img'){const u=URL.createObjectURL(d.blob);st.gal.unshift(u);show(u);gal();$('#tm').textContent='완료';done()}
else if(d.type==='err'){$('#tm').textContent='오류: '+d.msg;done()}};
st.worker.postMessage({type:'image',prompt:p,gap:st.safe?gapMs(st.model):0,duty:st.safe?imgDuty(st.model):0})};
}
function subView(){
app.innerHTML=head('자막 추출')+`<div class="card"><b>음성 / 영상 파일</b><div class="sub">mp3 · wav · m4a · mp4 · webm 등. 파일은 이 컴퓨터 밖으로 나가지 않습니다.</div>
<label class="ph drop" id="dz" for="fi" style="margin-top:8px;aspect-ratio:auto;padding:26px 12px">클릭하거나 파일을 끌어다 놓으세요</label>
<input type="file" id="fi" accept="audio/*,video/*" hidden><div id="pw"></div>
<div class="row" style="margin-top:10px;flex-wrap:wrap"><select id="lg"><option value="korean">한국어</option><option value="english">영어</option><option value="japanese">일본어</option><option value="chinese">중국어</option><option value="spanish">스페인어</option><option value="french">프랑스어</option><option value="">자동 감지</option></select>
<button class="btn" id="go" disabled>자막 추출</button><span class="sub" id="tm"></span></div>
<div class="bar" id="gb" style="display:none"><i></i></div></div>
<div class="card" id="rs" style="margin-top:12px;display:none"><div class="row" style="flex-wrap:wrap"><button class="btn ghost" id="d1">SRT 저장</button><button class="btn ghost" id="d2">VTT 저장</button><button class="btn ghost" id="d3">타임테이블(TXT) 저장</button><button class="btn ghost" id="d4">타임테이블 복사</button></div><div id="sl" style="margin-top:8px"></div></div>`;
$('#bk').onclick=()=>pick('sub');
let file=null,mel=null,segs=[],name='subtitle';
const p2=n=>String(n).padStart(2,'0');
const tcs=(t,sp)=>{t=Math.max(0,t);const h=Math.floor(t/3600),mi=Math.floor(t%3600/60),sc=Math.floor(t%60),ms=Math.min(999,Math.round((t-Math.floor(t))*1000));return p2(h)+':'+p2(mi)+':'+p2(sc)+sp+String(ms).padStart(3,'0')};
const tsh=t=>{const h=Math.floor(t/3600),mi=Math.floor(t%3600/60),sc=Math.floor(t%60);return h?h+':'+p2(mi)+':'+p2(sc):p2(mi)+':'+p2(sc)};
const setFile=f=>{if(!f||!(f.type.startsWith('audio/')||f.type.startsWith('video/')))return;
file=f;name=f.name.replace(/\.[^.]+$/,'')||'subtitle';
$('#dz').textContent=f.name+' · 클릭해서 다른 파일 선택';
mel=document.createElement(f.type.startsWith('video/')?'video':'audio');mel.className='pl';mel.controls=true;mel.src=URL.createObjectURL(f);
mel.ontimeupdate=()=>{const t=mel.currentTime;$('#sl').querySelectorAll('.sg').forEach(r=>{const g=segs[r.dataset.i];r.classList.toggle('on',t>=g.s&&t<g.e)})};
$('#pw').replaceChildren(mel);$('#go').disabled=false;$('#tm').textContent=''};
$('#fi').onchange=e=>{setFile(e.target.files[0]);e.target.value=''};
const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');setFile(e.dataTransfer.files[0])};
const dec=async f=>{const buf=await f.arrayBuffer(),ac=new(window.AudioContext||window.webkitAudioContext)();let d;
try{d=await ac.decodeAudioData(buf)}catch(e){throw new Error('이 파일의 오디오를 읽지 못했어요. mp3/wav/mp4로 시도해 주세요.')}finally{ac.close()}
const oc=new OfflineAudioContext(1,Math.ceil(d.duration*16000),16000),sr=oc.createBufferSource();sr.buffer=d;sr.connect(oc.destination);sr.start();
return (await oc.startRendering()).getChannelData(0)};
const addRow=(g,i)=>{const r=document.createElement('div');r.className='sg';r.dataset.i=i;
const b=document.createElement('button');b.className='tt';b.textContent=tsh(g.s)+' → '+tsh(g.e);b.onclick=()=>{mel.currentTime=g.s;mel.play()};
const ta=document.createElement('textarea');ta.rows=1;ta.value=g.t;
const fit_=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};ta.oninput=()=>{g.t=ta.value;fit_()};
r.append(b,ta);$('#sl').append(r);fit_()};
const ok=()=>segs.filter(g=>g.t.trim());
const SRT=()=>ok().map((g,i)=>(i+1)+'\n'+tcs(g.s,',')+' --> '+tcs(g.e,',')+'\n'+g.t.trim()+'\n').join('\n');
const VTT=()=>'WEBVTT\n\n'+ok().map(g=>tcs(g.s,'.')+' --> '+tcs(g.e,'.')+'\n'+g.t.trim()+'\n').join('\n');
const TBL=()=>ok().map(g=>tsh(g.s)+' '+g.t.trim()).join('\n');
const dl=(fn,tx,ty)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+tx],{type:ty+';charset=utf-8'}));a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('#d1').onclick=()=>dl(name+'.srt',SRT(),'application/x-subrip');
$('#d2').onclick=()=>dl(name+'.vtt',VTT(),'text/vtt');
$('#d3').onclick=()=>dl(name+'_timetable.txt',TBL(),'text/plain');
$('#d4').onclick=async()=>{try{await navigator.clipboard.writeText(TBL());$('#tm').textContent='타임테이블을 복사했어요'}catch(e){$('#tm').textContent='복사에 실패했어요. TXT로 저장해 주세요'}};
$('#go').onclick=async()=>{if(!file||st.busy)return;st.busy=true;wake(true);$('#go').disabled=true;$('#gb').style.display='block';$('#gb i').style.width='0';
segs=[];$('#sl').innerHTML='';$('#rs').style.display='none';
const done=m=>{wake(false);st.busy=false;$('#go').disabled=false;$('#gb').style.display='none';$('#tm').textContent=m};
try{$('#tm').textContent='오디오 읽는 중…';const a=await dec(file),dur=a.length/16000,buf=a.slice().buffer;
st.worker.onmessage=({data:d})=>{
if(d.type==='aseg'){$('#gb i').style.width=((d.i+1)/d.n*100)+'%';$('#tm').textContent=`음성 인식 중… ${d.i+1} / ${d.n} 구간`;
for(const c of d.chunks){const t=(c.t||'').trim();if(!t)continue;const s=d.off+(c.s??0);let e=c.e==null?Math.min(d.off+30,dur):d.off+c.e;if(e<=s)e=s+1;
const g={s,e,t};segs.push(g);$('#rs').style.display='block';addRow(g,segs.length-1)}}
else if(d.type==='adone')done(segs.length?`완료 · ${segs.length}줄`:'인식된 음성이 없습니다');
else if(d.type==='err')done('오류: '+d.msg)};
$('#tm').textContent='음성 인식 시작…';
st.worker.postMessage({type:'asr',audio:buf,lang:$('#lg').value},[buf])}
catch(e){done('오류: '+e.message)}};
}
function toolView(){
const m=st.model,bg=m.engine!=='sr',lab=bg?'배경 제거':'업스케일';
const note=bg?'결과는 투명 배경 PNG로 저장됩니다.':`처리 속도 때문에 긴 변 ${m.maxIn}px까지만 입력되고, 결과는 ${m.id==='swin-x4'?4:2}배 크기입니다.`;
app.innerHTML=head(lab)+`<div class="two">
<div class="card pa"><b>원본 이미지</b><div class="sub">${note}</div>
<label class="ph drop" id="dz" for="fi" style="margin-top:8px">클릭하거나 이미지를 끌어다 놓으세요</label>
<img id="pv" class="pv" alt="" title="클릭하면 다른 이미지를 선택합니다" style="display:none"><input type="file" id="fi" accept="image/*" hidden>
<div class="row" style="margin-top:10px"><button class="btn" id="go" disabled>${lab}</button><span class="sub" id="tm"></span></div></div>
<div class="card ga"><b>이전 결과</b><div class="gal" id="gl" style="margin-top:8px"></div><div class="sub" id="ge">아직 처리한 이미지가 없습니다</div></div>
<div class="card ra"><b>처리 결과</b><div class="ph" id="rph">처리된 이미지가 여기에 표시됩니다</div><div class="bar ind" id="gb" style="display:none"><i></i></div><img id="out" alt="" style="display:none"><button class="btn" id="sv" disabled>PNG 저장</button></div></div>`;
$('#bk').onclick=()=>pick('tool');
let src=null;
const show=(u,b)=>{$('#out').classList.toggle('chk',b);$('#out').src=u;$('#out').style.display='block';$('#rph').style.display='none';$('#sv').disabled=false};
const gal=()=>{$('#gl').innerHTML='';$('#ge').style.display=st.tgal.length?'none':'block';
st.tgal.forEach(o=>{const i=new Image();i.src=o.u;if(o.bg)i.className='chk';i.onclick=()=>show(o.u,o.bg);$('#gl').append(i)})};gal();
const setSrc=f=>{if(!f||!f.type.startsWith('image/'))return;const u=URL.createObjectURL(f),im=new Image();
im.onload=()=>{src=im;$('#pv').src=u;$('#pv').style.display='block';$('#dz').style.display='none';$('#go').disabled=false;$('#tm').textContent=`${im.naturalWidth}×${im.naturalHeight}`};
im.onerror=()=>{$('#tm').textContent='이미지를 읽을 수 없습니다'};im.src=u};
$('#fi').onchange=e=>{setSrc(e.target.files[0]);e.target.value=''};
$('#pv').onclick=()=>$('#fi').click();
for(const el of [$('#dz'),$('#pv')]){
el.ondragover=e=>{e.preventDefault();$('#dz').classList.add('on')};
el.ondragleave=()=>$('#dz').classList.remove('on');
el.ondrop=e=>{e.preventDefault();$('#dz').classList.remove('on');setSrc(e.dataTransfer.files[0])}}
$('#sv').onclick=()=>{const a=document.createElement('a');a.href=$('#out').src;a.download=(bg?'cutout-':'upscaled-')+Date.now()+'.png';a.click()};
const compose=async d=>{let c;
if(bg){const W=src.naturalWidth,H=src.naturalHeight,mc=document.createElement('canvas');mc.width=d.w;mc.height=d.h;
const mi=new ImageData(d.w,d.h);for(let i=0;i<d.mask.length;i++)mi.data[i*4+3]=d.mask[i];
mc.getContext('2d').putImageData(mi,0,0);
c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
x.drawImage(src,0,0,W,H);x.globalCompositeOperation='destination-in';x.imageSmoothingQuality='high';x.drawImage(mc,0,0,W,H)}
else{c=document.createElement('canvas');c.width=d.w;c.height=d.h;
const id=new ImageData(d.w,d.h),n=d.w*d.h,ch=d.c;
for(let i=0;i<n;i++){for(let k=0;k<3;k++)id.data[i*4+k]=d.data[i*ch+(ch>=3?k:0)];id.data[i*4+3]=255}
c.getContext('2d').putImageData(id,0,0)}
const b=await new Promise(r=>c.toBlob(r,'image/png')),u=URL.createObjectURL(b);
st.tgal.unshift({u,bg});show(u,bg);gal()};
$('#go').onclick=()=>{if(!src||st.busy)return;st.busy=true;$('#go').disabled=true;$('#gb').style.display='block';
const sc=Math.min(1,(m.maxIn||1024)/Math.max(src.naturalWidth,src.naturalHeight)),w=Math.max(1,Math.round(src.naturalWidth*sc)),h=Math.max(1,Math.round(src.naturalHeight*sc));
const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(src,0,0,w,h);
const px=cx.getImageData(0,0,w,h).data.buffer;
const t0=Date.now(),iv=setInterval(()=>$('#tm').textContent='처리 중… '+Math.round((Date.now()-t0)/1000)+'초',1000);
const done=()=>{clearInterval(iv);st.busy=false;$('#go').disabled=false;$('#gb').style.display='none'};
st.worker.onmessage=async({data:d})=>{
if(d.type==='tres'){try{await compose(d);$('#tm').textContent='완료'}catch(e){$('#tm').textContent='오류: '+e.message}done()}
else if(d.type==='err'){$('#tm').textContent='오류: '+d.msg;done()}};
st.worker.postMessage({type:'tool',px,w,h},[px])};
}
home();
</script></body></html>
